services:
  # =====================================================================
  # 1. WEB APP PORTAL (FastAPI + Giao diện quản lý luồng & kết quả AI)
  # =====================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-hongdatchy/cloudcam-ai:latest}
    container_name: cloudcam_app
    restart: unless-stopped
    working_dir: /app/web_app
    command: python -m uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "${APP_PORT:-8008}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - COORDINATOR_URL=${COORDINATOR_URL:-http://coordinator:8200}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_USER=${KAFKA_USER}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_FACE_TOPIC=${KAFKA_FACE_TOPIC}
      - KAFKA_FIRE_TOPIC=${KAFKA_FIRE_TOPIC}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./db_faces:/app/db_faces
      - ./web_app:/app/web_app
      - ./cloud_camera:/app/cloud_camera
    depends_on:
      - coordinator
    networks:
      - cloudcam_net

  # =====================================================================
  # 2. STREAM COORDINATOR (Điều phối tải, Failover giữa các node cắt frame)
  # =====================================================================
  coordinator:
    image: ${IMAGE_NAME:-hongdatchy/cloudcam-ai:latest}
    container_name: cloudcam_coordinator
    restart: unless-stopped
    working_dir: /app/cloud_camera
    command: python stream_coordinator.py
    ports:
      - "${COORDINATOR_PORT:-8200}:8200"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8200
      - NODES=${COORDINATOR_NODES:-http://extractor_node_1:8101,http://extractor_node_2:8102}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - HEALTHCHECK_INTERVAL=${HEALTHCHECK_INTERVAL:-10}
      - HEALTHCHECK_TIMEOUT=${HEALTHCHECK_TIMEOUT:-3}
    volumes:
      - ./cloud_camera:/app/cloud_camera
    depends_on:
      - extractor_node_1
      - extractor_node_2
    networks:
      - cloudcam_net

  # =====================================================================
  # 3. NODE CẮT ẢNH 1 (Frame Extractor Node 1 - Port 8101)
  # =====================================================================
  extractor_node_1:
    image: ${IMAGE_NAME:-hongdatchy/cloudcam-ai:latest}
    container_name: cloudcam_extractor_1
    restart: unless-stopped
    working_dir: /app/cloud_camera
    command: python frame_extractor_node.py --port 8101 --node-id node_1
    ports:
      - "${EXTRACTOR_NODE_1_PORT:-8101}:8101"
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ID=node_1
      - PORT=8101
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_USER=${KAFKA_USER}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_FACE_TOPIC=${KAFKA_FACE_TOPIC}
      - KAFKA_FIRE_TOPIC=${KAFKA_FIRE_TOPIC}
      - MAX_WORKERS=${EXTRACTOR_MAX_WORKERS:-50}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./cloud_camera:/app/cloud_camera
    networks:
      - cloudcam_net

  # =====================================================================
  # 4. NODE CẮT ẢNH 2 (Frame Extractor Node 2 - Port 8102)
  # =====================================================================
  extractor_node_2:
    image: ${IMAGE_NAME:-hongdatchy/cloudcam-ai:latest}
    container_name: cloudcam_extractor_2
    restart: unless-stopped
    working_dir: /app/cloud_camera
    command: python frame_extractor_node.py --port 8102 --node-id node_2
    ports:
      - "${EXTRACTOR_NODE_2_PORT:-8102}:8102"
    environment:
      - PYTHONUNBUFFERED=1
      - NODE_ID=node_2
      - PORT=8102
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_USER=${KAFKA_USER}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_FACE_TOPIC=${KAFKA_FACE_TOPIC}
      - KAFKA_FIRE_TOPIC=${KAFKA_FIRE_TOPIC}
      - MAX_WORKERS=${EXTRACTOR_MAX_WORKERS:-50}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./cloud_camera:/app/cloud_camera
    networks:
      - cloudcam_net

  # =====================================================================
  # 5. CONSUMER PHÁT HIỆN CHÁY/KHÓI (YOLOv8 - ai_fire_topic)
  # =====================================================================
  consumer_fire:
    image: ${IMAGE_NAME:-hongdatchy/cloudcam-ai:latest}
    container_name: cloudcam_consumer_fire
    restart: unless-stopped
    working_dir: /app/cloud_camera
    command: python ai_fire_consumer.py
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_USER=${KAFKA_USER}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_TOPIC=${KAFKA_FIRE_TOPIC}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_FIRE:-fire_detection_group}
      - FIRE_MAX_WORKERS=${AI_FIRE_MAX_WORKERS:-4}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./cloud_camera:/app/cloud_camera
      - ./db_faces:/app/db_faces
    networks:
      - cloudcam_net

  # =====================================================================
  # 6. CONSUMER NHẬN DIỆN KHUÔN MẶT (DeepFace + VGG-Face - ai_face_topic)
  # =====================================================================
  consumer_face:
    image: ${IMAGE_NAME:-hongdatchy/cloudcam-ai:latest}
    container_name: cloudcam_consumer_face
    restart: unless-stopped
    working_dir: /app/cloud_camera
    command: python ai_face_consumer.py
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_USER=${KAFKA_USER}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_TOPIC=${KAFKA_FACE_TOPIC}
      - KAFKA_GROUP_ID=${KAFKA_GROUP_ID_FACE:-face_recognition_group}
      - AI_MAX_WORKERS=${AI_FACE_MAX_WORKERS:-4}
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./cloud_camera:/app/cloud_camera
      - ./db_faces:/app/db_faces
      - deepface_weights:/root/.deepface
    networks:
      - cloudcam_net

# =====================================================================
# VOLUMES & NETWORKS
# =====================================================================
volumes:
  deepface_weights:
    name: cloudcam_deepface_weights

networks:
  cloudcam_net:
    name: cloudcam_net
    driver: bridge
